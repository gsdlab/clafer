# for GHC-9.12.4
resolver: nightly-2026-11-11

flags:
  # The test suite that compiles the models in test/positive and test/negative.
  clafer:
    model-tests: true
packages:
- '.'

# GHC compiles the modules of a package on 8 threads, which takes a third less time than one
# thread; 16 threads are not faster.
# (build: semaphore: true, GHC's -jsem, fails with Stack 3.11.1: "semOpen: does not exist".)
ghc-options:
  "$everything": -j8
